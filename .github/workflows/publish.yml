name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Manual trigger, so a run that never gets scheduled can be retried without
  # deleting and re-pushing the tag. Pick the release tag as the ref: running
  # it against a branch builds whatever version pyproject.toml currently has.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . && pip install pytest pytest-xdist
      - run: python -m pytest tests/ -n auto
      # python_version in pyproject.toml makes the result the same on every Python.
      - if: matrix.python-version == '3.13'
        run: pip install mypy==2.4.0 && scripts/typecheck.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
