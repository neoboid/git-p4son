name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Manual trigger, so a run that never gets scheduled can be retried without
  # deleting and re-pushing the tag. Pick the release tag as the ref: running
  # it against a branch builds whatever version pyproject.toml currently has.
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
