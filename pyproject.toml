[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-p4son"
version = "0.6.0"
description = "Utility for keeping a Perforce workspace and local git repo in sync"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Andreas Andersson", email = "andreas@neoboid.com"}
]
keywords = ["perforce", "git", "version-control", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]

[tool.setuptools.packages.find]
include = ["git_p4son*"]

[tool.setuptools.package-data]
git_p4son = ["completions/*", "skill/*"]

[project.scripts]
git-p4son = "git_p4son.cli:main"

[project.urls]
Homepage = "https://github.com/neoboid/git-p4son"
Repository = "https://github.com/neoboid/git-p4son"
Issues = "https://github.com/neoboid/git-p4son/issues"
Changelog = "https://github.com/neoboid/git-p4son/blob/main/CHANGELOG.md"

[tool.mypy]
files = ["git_p4son", "tests"]
# The oldest supported Python, so newer syntax is flagged.
python_version = "3.11"
strict = true

# Test functions need no annotations; strict still checks their bodies (check_untyped_defs).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# The helpers every test builds on are held to full strict.
[[tool.mypy.overrides]]
module = "tests.helpers"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
